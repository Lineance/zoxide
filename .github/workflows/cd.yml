name: cd
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  publish-crates-io:
    name: Publish on crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish primary package
        run: cargo publish --package zoxide-romanized --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for primary package index
        run: |
          for attempt in {1..30}; do
            if cargo info zoxide-romanized --registry crates-io >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "zoxide-romanized was not available from crates.io in time" >&2
          exit 1
      - name: Publish compatibility package
        run: cargo publish --package zoxide-pinyin --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
